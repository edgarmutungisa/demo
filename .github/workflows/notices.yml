name: Refresh notices

# Collects livestock-health notices for Uganda (outbreaks, quarantines, vaccination
# calls) every 3 hours and commits notices.json when they change. The page reads it
# for the NOTICES button. Source code: scripts/notices.py, mirrored from
# edgarmutungisa/DSTUganda domain/services/notices.py.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/notices.py", ".github/workflows/notices.yml"]

permissions:
  contents: write

concurrency:
  group: notices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect notices
        run: python scripts/notices.py --out notices.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notices.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Refresh notices"
          git pull --rebase origin main
          git push origin HEAD:main
