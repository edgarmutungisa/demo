name: Refresh notices

# Every 3 hours:
# 1. Collects livestock-health notices for Uganda (outbreaks, quarantines, vaccination
#    calls) into notices.json, read by the NOTICES button. Source: scripts/notices.py,
#    mirrored from edgarmutungisa/DSTUganda domain/services/notices.py.
# 2. Once a day, publishes real Sentinel-2 grass greenness for Kasese and Isingiro into
#    greenness/ (index.json + one small file per 0.1 degree tile), read by "where is good
#    grass near me?". Source: scripts/greenness.py, mirrored from
#    domain/services/greenness_tiles.py. Needs two repository secrets:
#    GEE_SERVICE_ACCOUNT_KEY (the Earth Engine service-account JSON key) and GEE_PROJECT.
#    Without them this step is skipped and the page labels greenness as SAMPLE.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/notices.py", "scripts/greenness.py", ".github/workflows/notices.yml"]

permissions:
  contents: write

concurrency:
  group: notices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect notices
        run: python scripts/notices.py --out notices.json
      - name: Publish satellite grass greenness (daily)
        continue-on-error: true      # a failed satellite run must never block the notices
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
        run: |
          if [ -z "$GEE_SERVICE_ACCOUNT_KEY" ]; then echo "GEE_SERVICE_ACCOUNT_KEY not set: greenness skipped"; exit 0; fi
          pip install --quiet earthengine-api==1.7.4
          python scripts/greenness.py --out-dir greenness
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notices.json
          if [ -d greenness ]; then git add greenness; fi
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Refresh notices and greenness"
          git pull --rebase origin main
          git push origin HEAD:main
